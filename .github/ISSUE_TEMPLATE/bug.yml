name: Bug
description: Unexpected behavior in this repository (docs, templates, or later tooling).
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do **not** use this form for secrets or
        vulnerabilities — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What actually happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps another person can follow.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version (if relevant), and Cursor version.
      value: |
        - OS:
        - Node:
        - Cursor:
    validations:
      required: true
